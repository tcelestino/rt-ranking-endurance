name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # PRs de atualização de dados (update-*) não precisam de CI; job pulado conta como aprovado no check obrigatório
    if: ${{ !(startsWith(github.head_ref, 'update-') && github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Verificar tipos do backoffice
        run: npm run backoffice:check

      - name: Verificar tipos do worker
        run: npm run worker:check

      - name: Testes
        run: npm test

      - name: Verificar bundle do worker
        run: npm run worker:dryrun
